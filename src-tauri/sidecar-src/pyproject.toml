# Dev-only: needed to export the ONNX model at CI build time, not at runtime.
# Moving these here keeps torch (~2 GB) out of the user's first-launch install.
[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "sentence-transformers>=5.5.0",
    "optimum[onnxruntime]>=1.21.0",
]
