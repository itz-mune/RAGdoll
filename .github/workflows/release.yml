name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0) — must match an existing git tag'
        required: true

permissions:
  contents: write

env:
  # Opt into Node.js 24 for all actions (avoids Node 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            uv-ext: '.exe'
          - os: macos-14         # Apple Silicon
            target: aarch64-apple-darwin
            uv-ext: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            uv-ext: ''
            # Skip RPM — xz-compressing a large binary takes hours on CI.
            # AppImage + deb cover the vast majority of Linux users.
            extra-args: '--bundles deb,appimage'

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── uv ───────────────────────────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Ensure uv.lock is current after the pyproject.toml dep-group changes.
      # A no-op if the lockfile is already up to date.
      - name: Update uv lockfile
        working-directory: sidecar
        run: uv lock

      # Install dev-only deps (sentence-transformers, optimum[onnxruntime]) so
      # we can pre-export the ONNX model at CI time.
      # These are in [dependency-groups.dev] — end users NEVER install torch.
      - name: Export ONNX embedding model
        working-directory: sidecar
        run: |
          uv sync --group dev
          uv run python export_onnx_model.py

      # Seed preinstalled plugins from the public plugins registry.
      # lib.rs copies sidecar-src/ragdoll_plugins/ → AppData on first launch.
      - name: Fetch preinstalled plugins
        shell: bash
        run: |
          git clone --depth 1 https://github.com/itz-mune/RAGdoll-plugins.git _plugins_tmp
          mkdir -p sidecar/ragdoll_plugins
          SRC="_plugins_tmp/plugins"
          if [ -d "$SRC" ]; then
            cp -r "$SRC/." sidecar/ragdoll_plugins/
            echo "Seeded $(ls sidecar/ragdoll_plugins | wc -l | tr -d ' ') plugin(s)"
          else
            echo "No plugins/ dir in plugins repo — skipping seed"
          fi
          rm -rf _plugins_tmp

      # Bundle the full sidecar Python source tree into src-tauri/sidecar-src/
      # so Tauri can include it as a resource (see tauri.conf.json → resources).
      # Excludes .venv (large), dist, build, byte-compiled caches, and spec files.
      # The pre-exported ONNX model (sidecar/models/) IS included.
      - name: Prepare sidecar-src bundle
        shell: bash
        run: |
          DST="src-tauri/sidecar-src"
          rm -rf "$DST"
          cp -r sidecar "$DST"

          # Strip build artefacts and dev-only directories
          rm -rf "$DST/.venv" "$DST/dist" "$DST/build"

          # Remove byte-compiled files and PyInstaller spec
          find "$DST" -name '*.pyc' -delete 2>/dev/null || true
          find "$DST" -name '*.pyo' -delete 2>/dev/null || true
          find "$DST" -name '*.spec' -delete 2>/dev/null || true
          find "$DST" -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true

          echo "sidecar-src ready — $(find "$DST" -type f | wc -l | tr -d ' ') files"
          ls -la "$DST"

      # Place the CI uv binary into src-tauri/binaries/ using Tauri's
      # externalBin naming convention: uv-{triple}(.exe).
      # At install time Tauri strips the triple suffix → uv / uv.exe beside the exe.
      - name: Place uv binary for Tauri
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          UV_PATH="$(which uv)"
          DST="src-tauri/binaries/uv-${{ matrix.target }}${{ matrix.uv-ext }}"
          cp "$UV_PATH" "$DST"
          echo "Placed uv → $DST"

      # ── Node / pnpm ──────────────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Linux system libraries ────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            libglib2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            shared-mime-info \
            libgtk-3-dev

      # ── Build & publish ───────────────────────────────────────────────────────
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RAGdoll ${{ github.ref_name }}'
          releaseBody: |
            See the [**What's New**](https://github.com/itz-mune/RAGdoll#-whats-new--v020) section in the README for full release notes.

            > **First-time install?** Download the installer for your OS below.
            > **Existing install?** RAGdoll will prompt you to update automatically.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.extra-args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
