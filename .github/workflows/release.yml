name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0) — must match an existing git tag'
        required: true

permissions:
  contents: write

env:
  # Opt into Node.js 24 for all actions (avoids Node 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar-ext: '.exe'
          - os: macos-13         # Intel
            target: x86_64-apple-darwin
            sidecar-ext: ''
          - os: macos-14         # Apple Silicon
            target: aarch64-apple-darwin
            sidecar-ext: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar-ext: ''

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python / uv / sidecar ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: uv sync --frozen

      # Export the ONNX model BEFORE PyInstaller so it gets bundled into the
      # binary as a datas entry. This avoids bundling the full PyTorch runtime
      # (~2-3 GB) which would push the onefile archive over PyInstaller's 4 GB
      # CArchive limit. The model (~25 MB quantized) is tiny by comparison.
      - name: Pre-export ONNX embedding model
        working-directory: sidecar
        run: uv run python export_onnx_model.py

      - name: Build sidecar with PyInstaller
        working-directory: sidecar
        run: uv run pyinstaller ragdoll-sidecar.spec --noconfirm

      - name: Place sidecar binary for Tauri
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          SRC="sidecar/dist/ragdoll-sidecar${{ matrix.sidecar-ext }}"
          DST="src-tauri/binaries/ragdoll-sidecar-${{ matrix.target }}${{ matrix.sidecar-ext }}"
          cp "$SRC" "$DST"
          echo "Placed sidecar → $DST"

      # ── Node / pnpm ──────────────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── Linux system libraries ────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm

      # ── Build & publish ───────────────────────────────────────────────────────
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RAGdoll ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/itz-mune/RAGdoll/blob/main/CHANGELOG.md) for full release notes.

            > **First-time install?** Download the installer for your OS below.
            > **Existing install?** RAGdoll will prompt you to update automatically.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
