<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAGdoll</title>
    <!-- Dark background before CSS loads — eliminates white flash during startup -->
    <style>html, body { background: #0d0d0d; margin: 0; }</style>
  </head>

  <body>
    <div id="root">
      <!--
        Pre-React loading screen — visible from first paint until React hydrates.
        React's createRoot().render() replaces this content automatically.
        All styles are inline so they work before any stylesheet loads.
      -->
      <div id="pre-react-splash" style="
        --pl-accent: #7c3aed;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        height:100vh; width:100vw; gap:0;
        background:#0d0d0d; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        user-select:none;
      ">
        <!-- Restore accent colour from localStorage before first paint -->
        <script>
          (function(){try{var a=JSON.parse(localStorage.getItem('ragdoll-accent')||'{}');if(a.h)document.getElementById('pre-react-splash').style.setProperty('--pl-accent','hsl('+a.h+','+a.s+','+a.l+')');}catch(e){}})();
        </script>

        <!-- Logo -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 375" width="80" height="80"
             aria-hidden="true" style="color:var(--pl-accent); margin-bottom:20px;" width="88" height="88">
          <defs>
            <clipPath id="pl-a"><path d="M 146 98 L 181 98 L 181 133 L 146 133 Z" clip-rule="nonzero"/></clipPath>
            <clipPath id="pl-b"><path d="M 141.808594 105.839844 L 173.324219 93.328125 L 185.839844 124.84375 L 154.320312 137.359375 Z" clip-rule="nonzero"/></clipPath>
            <clipPath id="pl-c"><path d="M 157.566406 99.585938 C 148.863281 103.039062 144.609375 112.898438 148.066406 121.601562 C 151.519531 130.304688 161.378906 134.558594 170.082031 131.101562 C 178.785156 127.648438 183.039062 117.789062 179.582031 109.085938 C 176.128906 100.382812 166.269531 96.128906 157.566406 99.585938 Z" clip-rule="nonzero"/></clipPath>
            <clipPath id="pl-d"><path d="M 0 0 L 35 0 L 35 35 L 0 35 Z" clip-rule="nonzero"/></clipPath>
            <clipPath id="pl-e"><path d="M -4.191406 7.839844 L 27.324219 -4.671875 L 39.839844 26.84375 L 8.320312 39.359375 Z" clip-rule="nonzero"/></clipPath>
            <clipPath id="pl-f"><path d="M 11.566406 1.585938 C 2.863281 5.039062 -1.390625 14.898438 2.066406 23.601562 C 5.519531 32.304688 15.378906 36.558594 24.082031 33.101562 C 32.785156 29.648438 37.039062 19.789062 33.582031 11.085938 C 30.128906 2.382812 20.269531 -1.871094 11.566406 1.585938 Z" clip-rule="nonzero"/></clipPath>
            <clipPath id="pl-g"><rect x="0" y="0" width="35" height="35"/></clipPath>
          </defs>
          <path stroke-linecap="round" transform="matrix(0.729772,0.17301,-0.17301,0.729772,94.51034,127.335373)" fill="none" stroke-linejoin="miter" d="M 8.498811 8.498622 L 98.778021 8.501183" stroke="currentColor" stroke-width="17" stroke-miterlimit="4"/>
          <path stroke-linecap="round" transform="matrix(0.238383,0.711107,-0.711107,0.238383,170.061497,144.059302)" fill="none" stroke-linejoin="miter" d="M 8.498504 8.500017 L 118.137476 8.499039" stroke="currentColor" stroke-width="17" stroke-miterlimit="4"/>
          <path stroke-linecap="round" transform="matrix(-0.544367,0.515911,-0.515911,-0.544367,199.846223,232.258785)" fill="none" stroke-linejoin="miter" d="M 8.500591 8.502915 L 98.78121 8.500428" stroke="currentColor" stroke-width="17" stroke-miterlimit="4"/>
          <path stroke-linecap="round" transform="matrix(-0.729772,-0.17301,0.17301,-0.729772,280.478804,247.664602)" fill="none" stroke-linejoin="miter" d="M 8.499923 8.498325 L 98.779133 8.500886" stroke="currentColor" stroke-width="17" stroke-miterlimit="4"/>
          <path stroke-linecap="round" transform="matrix(-0.238383,-0.711107,0.711107,-0.238383,204.928659,230.940688)" fill="none" stroke-linejoin="miter" d="M 8.499286 8.497642 L 118.136602 8.501603" stroke="currentColor" stroke-width="17" stroke-miterlimit="4"/>
          <path stroke-linecap="round" transform="matrix(0.544367,-0.515911,0.515911,0.544367,175.142938,142.741176)" fill="none" stroke-linejoin="miter" d="M 8.499704 8.502146 L 98.780324 8.499659" stroke="currentColor" stroke-width="17" stroke-miterlimit="4"/>
          <g clip-path="url(#pl-a)"><g clip-path="url(#pl-b)"><g clip-path="url(#pl-c)"><g transform="matrix(1,0,0,1,146,98)"><g clip-path="url(#pl-g)"><g clip-path="url(#pl-d)"><g clip-path="url(#pl-e)"><g clip-path="url(#pl-f)">
            <path fill="currentColor" d="M -4.191406 7.839844 L 27.324219 -4.671875 L 39.839844 26.84375 L 8.320312 39.359375 Z" fill-opacity="1" fill-rule="nonzero"/>
          </g></g></g></g></g></g></g></g>
        </svg>

        <!-- App name -->
        <p style="margin:0 0 6px; font-size:17px; font-weight:600; color:#f4f4f5; letter-spacing:-0.01em;">RAGdoll</p>

        <!-- Status text -->
        <p style="margin:0 0 28px; font-size:12px; color:#52525b; letter-spacing:0.01em;">Starting up…</p>

        <!-- Spinner — track muted, active arc in accent colour -->
        <div style="
          width:18px; height:18px; border-radius:50%;
          border:2px solid #27272a; border-top-color:var(--pl-accent);
          animation:pl-spin 0.75s linear infinite;
        "></div>

        <style>@keyframes pl-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
